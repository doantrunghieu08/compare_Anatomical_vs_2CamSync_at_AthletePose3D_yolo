input:
  dataset_root: inputs
  pose2d_root: inputs
  test_set_subdir: data
  manifest_file: manifest_progress.csv
  video_extension: .mp4
  metadata_extension: .json
  ground_truth_extension: .npy
  pose_2d_suffix: _coco.npy
  key_frames_suffix: _key_frames.npy
  pose_cache_limit: 550
  minimum_manifest_confidence: 0.6

output:
  results_csv: outputs/results.csv
  overwrite: false

pipeline:
  max_pairs: 15
  chunk_size: 5
  frames_per_pair: 30
  sync_max_offset: 45
  sync_samples: 5
  sync_coarse_step: 7
  sync_local_radius: 2
  dynamic_local_radius: 5
  max_pair_candidates: 132
  max_dynamic_sync_score: 155.0
  sync_minimum_joint_confidence: 0.25
  sync_minimum_valid_joints: 8
  minimum_pair_valid_ratio: 0.5
  dynamic_transition_weight: 7.5
  minimum_joint_confidence: 0.3
  minimum_valid_joints: 8
  subject_height_mm: auto
  subject_heights:
    S1: 1780.0
    S2: 1650.0
    S3: 1732.0
  # GT marker groups per dataset; joint indices follow the H36M 17-joint layout.
  # A multi-marker group is averaged only where the two markers define a joint center.

  subject_gt_joint_markers:
    S1:
      0: [PELVIS]
      1: [R_Hip Joint]
      2: [RKNE]
      3: [RANK]
      4: [L_Hip Joint]
      5: [LKNE]
      6: [LANK]
      7: [T10]
      8: [Manubrium]
      9: [C7]
      10: [Vertex]
      11: [L_Shoulder Joint]
      12: [L_Lateral Elbow, L_Medial Elbow]
      13: [L_Lateral Wrist, L_Medial Wrist]
      14: [R_Shoulder Joint]
      15: [R_Lateral Elbow, R_Medial Elbow]
      16: [R_Lateral Wrist, R_Medial Wrist]

    S2:
      0: [PELVIS]
      1: [R_Hip Joint]
      2: [R_Lateral Tibial Condyle, R_Medial Tibial Condyle]
      3: [R_Lateral Ankle, R_Medial Ankle]
      4: [L_Hip Joint]
      5: [L_Lateral Tibial Condyle, L_Medial Tibial Condyle]
      6: [L_Lateral Ankle, L_Medial Ankle]
      7: [T8]
      8: [Manubrium]
      9: [C7]
      10: [Vertex]
      11: [L_Shoulder Joint]
      12: [L_Lateral Elbow, L_Medial Elbow]
      13: [L_Lateral Wrist, L_Medial Wrist]
      14: [R_Shoulder Joint]
      15: [R_Lateral Elbow, R_Medial Elbow]
      16: [R_Lateral Wrist, R_Medial Wrist]

    S3:
      0: [PELVIS]
      1: [R_Hip Joint]
      2: [RKNE]
      3: [RANK]
      4: [L_Hip Joint]
      5: [LKNE]
      6: [LANK]
      7: [T10]
      8: [Manubrium]
      9: [C7]
      10: [Vertex]
      11: [L_Shoulder Joint]
      12: [L_Lateral Elbow, L_Medial Elbow]
      13: [L_Lateral Wrist, L_Medial Wrist]
      14: [R_Shoulder Joint]
      15: [R_Lateral Elbow, R_Medial Elbow]
      16: [R_Lateral Wrist, R_Medial Wrist]

  reference_fps: 60.0
  fps_mode: auto
  subject_fps:
    S1: auto
    S2: auto
    S3: auto
  excluded_subjects: []
  excluded_motions: []
  bone_prior: sequence_median
  bone_prior_min_samples: 5
  bone_prior_min_confidence: 0.4
  sequence_refinement:
    enabled: true
    data_weight: 0.34
    root_weight: 0.80
    bone_weight: 0.70
    reprojection_weight: 0.46
    smoothness_weight: 0.060
    symmetry_weight: 0.12
    max_evaluations: 30
    max_drift: 360.0

method:
  name: dst_physics
  options:
    iterations: 80
    bone_weight: 0.5
    data_weight: 1.0
    anchor_weight: 0.1  # Decoupled DLT anchor ablation {0.3, 0.1, 0.0}
    sym_weight: 0.2
    bone_reliability_modulation: false  # S1 ablation: modulation lowered the measured gain.
    fusion_sources: [detector, epipolar, bone]
    fusion_epi_mode: sampson
    fusion_rule: yager
    fusion_unknown_trust: 0.3
    fusion_bone_mode: joint
    init_mode: dlt  # Decoupled initialization {dlt, temporal}
    hypothesis_selection: false  # Per-joint BetP hypothesis selection
    lr: 1.0
    delta_ray_mm: 5.0
    ground_z: null
    use_nimble_ik: false
